  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}" />
  <meta name="author" content="{{ site.author }}" />

  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml" />
  <link rel="canonical" href="{{ page.url | absolute_url }}" />
  <link rel="sitemap" type="application/xml" href="{{ '/sitemap.xml' | absolute_url }}" />

  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}" />
  <meta property="og:title" content="{{ page.title | default: site.title }}" />
  <meta property="og:description" content="{{ page.description | default: site.description }}" />
  <meta property="og:url" content="{{ page.url | absolute_url }}" />
  <meta property="og:site_name" content="{{ site.title }}" />
  {% if page.imageUrl %}
  <meta property="og:image" content="{{ page.imageUrl }}" />
  <meta name="twitter:image" content="{{ page.imageUrl }}" />
  {% endif %}
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:creator" content="@zheeno_rocks" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Public+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="{{ '/assets/tokens.css' | relative_url }}?v=3" />
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}?v=4" />
  <link rel="stylesheet" href="{{ '/assets/editorial.css' | relative_url }}?v=11" />

  <script src="{{ '/assets/images.js' | relative_url }}?v=1" defer></script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Libre Bodoni', 'Georgia', 'serif'],
            sans: ['Public Sans', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
          },
        },
      },
    };
  </script>
