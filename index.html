---
layout: default
---

<div class="site-shell">
  <header class="site-masthead">
    <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-6">
      <div>
        <p class="masthead-eyebrow">Newsletter</p>
        <h1 class="masthead-title">
          <a href="{{ '/' | relative_url }}" class="no-underline hover:opacity-80 transition-opacity" style="text-decoration: none; color: inherit;">
            Efezino Ukpowe
          </a>
        </h1>
        <p class="masthead-dek">{{ site.description }}</p>
      </div>
      <nav class="site-nav" aria-label="Primary">
        <a href="#latest">Latest</a>
        <a href="#subscribe">Subscribe</a>
      </nav>
    </div>
  </header>

  <main id="content" class="home-main">
    <section id="latest" class="home-archive">
      <div class="home-archive-header">
        <div>
          <p class="section-label">Archive</p>
          <h2 class="home-archive-title">Latest issues</h2>
        </div>
        <p id="post-count" class="section-label" aria-live="polite"></p>
      </div>

      <ul id="posts" class="post-grid" aria-live="polite" aria-busy="true"></ul>
    </section>

    {% include subscribe.html %}
  </main>

  {% include footer.html %}
</div>

<script src="{{ '/assets/main.js' | relative_url }}?v=2"></script>
