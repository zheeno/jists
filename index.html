<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Efezino Ukpowe — Newsletter</title>
  <meta name="description" content="Daily “what’s trending” analysis with practical takeaways." />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="brand">
        <h1>Efezino Ukpowe — Newsletter</h1>
        <p class="tagline">Daily “what’s trending” analysis with practical takeaways. Sponsor spotlights available when relevant.</p>
      </div>
      <div class="badges">
        <div class="badge"><span class="dot"></span>Fresh daily posts</div>
        <div class="badge">No spam • Just takeaways</div>
      </div>
    </div>

    <div class="card">
      <h2 class="section-title">Latest posts</h2>
      <ul id="posts" class="post-list"></ul>
      <footer>Updates are generated automatically from `/opt/data/content-arbitrage/output/`.</footer>
    </div>
  </div>

  <script>
    fetch('feed.json')
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(data => {
        const ul = document.getElementById('posts');
        (data.items || []).forEach(it => {
          const li = document.createElement('li');
          li.className = 'post-item';

          const a = document.createElement('a');
          a.href = it.url;

          const h3 = document.createElement('h3');
          h3.textContent = it.title;
          a.appendChild(h3);

          const meta = document.createElement('p');
          meta.className = 'post-meta';
          const src = it.source ? it.source : 'newsletter';
          meta.textContent = `${it.date} • ${src}`;
          a.appendChild(meta);

          li.appendChild(a);
          ul.appendChild(li);
        });
      })
      .catch(() => {})
  </script>
</body>
</html>
