<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page.title }}</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="container">
    <p class="muted" style="margin:0 0 10px;color:var(--muted)">
      <a id="homeLink" href="" style="color:var(--link)">← Home</a>
    </p>

    <div style="margin:6px 0 18px">
      <h1 style="margin:0 0 6px;font-size:1.55rem;letter-spacing:-.02em">{{ page.title }}</h1>
      <div class="meta" style="color:var(--muted);font-size:.95rem">
        {{ page.date }} • {{ page.source | default: 'newsletter' }}
      </div>
    </div>

    <article>
      {{ content }}
    </article>

    <footer>Thanks for reading — share one practical takeaway.</footer>
  </div>

  <script>
    // Compute repo root dynamically so Home link works after renames.
    // Example path: /jists/2026/07/31/post.html -> base is /jists/
    (function(){
      try {
        const seg = window.location.pathname.split('/').filter(Boolean);
        const repo = seg[0];
        const home = window.location.origin + '/' + repo + '/';
        const el = document.getElementById('homeLink');
        if (el) el.href = home;
      } catch(e) {}
    })();
  </script>
</body>
</html>
