---
layout: default
---

<article class="site-shell" style="max-width: 56rem;">
  <header class="article-header">
    <a data-home-link href="./" class="back-link">
      <span aria-hidden="true">←</span>
      <span>All issues</span>
    </a>
    <p class="article-eyebrow">{{ page.date | date: '%B %d, %Y' }} · {{ page.source | default: 'newsletter' }}</p>
    <h1 class="article-title">{{ page.title }}</h1>
  </header>

  <div id="content" class="article-body fade-in">
    <div class="editorial-content">{{ content }}</div>
  </div>

  {% include subscribe.html %}
  <p class="article-footer-tip">Tip: share one takeaway with a friend or team.</p>
  {% include footer.html %}
</article>
